version: "3.9"

services:

  # ---------------- INFRA ---------------- #

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - bookstore-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_started

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test: [ "CMD", "bash", "-c", "nc -z localhost 9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "9092:9092"
    networks:
      - bookstore-net

  redis:
    image: redis:7-alpine
    networks:
      - bookstore-net

  # ---------------- DATABASES ---------------- #

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-net

  product-db:
    image: postgres:16
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-net

  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-net

  # ---------------- CORE ---------------- #

  eureka:
    build: ./eureka-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8761:8761"
    networks:
      - bookstore-net

  config-server:
    build: ./config-server
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8888:8888"
    networks:
      - bookstore-net

  # ---------------- SERVICES ---------------- #

  user-service:
    build: ./user-service
    depends_on:
      user-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      JWT_SECRET: bookstore-super-secret-key-2024-must-be-at-least-256-bits
    ports:
      - "8081:8081"
    networks:
      - bookstore-net

  product-service:
    build: ./product-service
    depends_on:
      product-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "8083:8083"
    networks:
      - bookstore-net

  order-service:
    build: ./order-service
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      KAFKA_SERVERS: kafka:9092
    ports:
      - "8087:8087"
    networks:
      - bookstore-net

  api-gateway:
    build: ./api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "8080:8080"
    networks:
      - bookstore-net

networks:
  bookstore-net:
    driver: bridge